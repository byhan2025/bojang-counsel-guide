# =====================================================================
# 보장분석 라이프 리포트 v5.4 — Supabase 로컬/원격 설정
# 적용:
#   supabase link --project-ref <PROJECT_REF>
#   supabase db push
#   supabase functions deploy parse-coverage-vision billing-subscribe billing-webhook
# =====================================================================

project_id = "bojang-guide"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://byhan2025.github.io/bojang-counsel-guide/", "http://localhost:8000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.kakao]
enabled = false
# client_id = "KAKAO_REST_API_KEY"
# secret = "KAKAO_CLIENT_SECRET"

[auth.external.google]
enabled = false
# client_id = "GOOGLE_CLIENT_ID"
# secret = "GOOGLE_CLIENT_SECRET"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8083

[analytics]
enabled = false

# ---- Edge Functions ----
# JWT 검증은 게이트웨이에서 한 번, 함수 내부에서 한 번 더(requireUser) 수행합니다.
[functions.parse-coverage-vision]
enabled = true
verify_jwt = true
entrypoint = "./functions/parse-coverage-vision/index.ts"

[functions.billing-subscribe]
enabled = true
verify_jwt = true
entrypoint = "./functions/billing-subscribe/index.ts"

# PG 웹훅은 Supabase JWT 가 아니라 PG 서명(PG_WEBHOOK_SECRET)으로 인증합니다.
[functions.billing-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/billing-webhook/index.ts"
